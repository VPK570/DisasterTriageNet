name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest shap hdbscan

      - name: Run backend tests
        working-directory: backend
        run: |
          python -m pytest test_validators.py test_ml_model.py test_auth.py test_task_queue.py test_clustering.py -v --tb=short

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install flake8

      - name: Lint
        working-directory: backend
        run: |
          flake8 . --max-line-length=120 --ignore=E501,W503 --exclude=migrations,__pycache__,.pytest_cache

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: rescue-dashboard
        run: npm ci

      - name: Run tests
        working-directory: rescue-dashboard
        run: npm test -- --watchAll=false || true

      - name: Build
        working-directory: rescue-dashboard
        run: npm run build